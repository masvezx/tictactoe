name: Build backend image

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'api/**'

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Log in to ACR
      uses: docker/login-action@v3
      with:
        registry: masvezx.azurecr.io
        username: masvezx
        password: ${{ secrets.ACR_SECRET }}
    - name: Build the Docker image
      run: docker build ./api --file ./api/Dockerfile --tag masvezx.azurecr.io/ttt-backend:${{ github.run_number }}-${{ github.run_attempt }}
    - name: Push the Docker image
      run: docker push masvezx.azurecr.io/ttt-backend:${{ github.run_number }}-${{ github.run_attempt }}
